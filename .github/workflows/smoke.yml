name: Smoke Tests

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  NODE_OPTIONS: "--dns-result-order=ipv4first"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write
  pages: write

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check Amtrak from the runner
        run: |
          getent ahosts www.amtrak.com | head -20
          curl -sS -o /dev/null -w "http_code=%{http_code} time=%{time_total} err=%{errormsg}\n" --max-time 20 -I https://www.amtrak.com/home || true
      - name: smoke tests
        run: npm run test:smoke
      - name: Upload Cypress report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cypress-report
          path: cypress-report
          retention-days: 10
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            cypress/videos
            cypress/screenshots
          retention-days: 5
      - name: Upload GitHub Pages artifact
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: cypress-report

  pages:
    name: Publish report to GitHub Pages
    needs: smoke-tests
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.smoke-tests.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
