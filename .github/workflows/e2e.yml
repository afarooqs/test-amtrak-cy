name: E2E Tests

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  NODE_OPTIONS: "--dns-result-order=ipv4first"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write
  pages: write

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pin Amtrak to IPv4
        run: |
          ipv4=$(getent ahostsv4 www.amtrak.com | awk '{print $1; exit}')
          echo "$ipv4 www.amtrak.com amtrak.com" | sudo tee -a /etc/hosts
          curl -sS -o /dev/null -w "GET http_code=%{http_code} time=%{time_total}\n" --max-time 20 https://www.amtrak.com/home || true
      - name: e2e tests
        run: npm run test
      - name: Upload Cypress report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cypress-report
          path: cypress-report
          retention-days: 10
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            cypress/videos
            cypress/screenshots
          retention-days: 5
      - name: Upload GitHub Pages artifact
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: cypress-report

  pages:
    name: Publish report to GitHub Pages
    needs: e2e-tests
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.e2e-tests.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
